name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets an already-pushed tag be published, or re-published, without moving the
  # tag. A tag push is the normal path; this exists so fixing a release does not
  # require rewriting a published ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.10'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: GoReleaser derives the version and changelog from tags,
          # and the checksum/signing steps need the tag to be present locally.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # GoReleaser shells out to `syft` for the SPDX SBOMs and does not bundle it.
      # This was the sole cause of the failed v0.1.11 release: the `sboms` block
      # had been in .goreleaser.yaml since it was written, and `goreleaser check`
      # validates configuration without running the pipeline, so the missing
      # binary only surfaced on the first real `goreleaser release`.
      #
      # The syft version is pinned rather than floated, so an SBOM format change
      # upstream cannot alter a published release without a deliberate bump.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.52.0

      # GoReleaser shells out to `cosign` for the keyless signature and does not
      # install it. `id-token: write` in the job permissions above is what lets
      # cosign obtain a Fulcio certificate without any stored key.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # GoReleaser comes from its published binary via the official action.
      # `go install github.com/goreleaser/goreleaser@latest` pulled
      # golang.org/x/tools@v0.21.0, which does not compile under Go 1.26.
      #
      # `check` only validated the config, which is why v0.1.7 through v0.1.10
      # shipped with a tag and no artefacts. This now publishes.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.yaml
        env:
          # GITHUB_TOKEN is provided automatically by Actions and is what
          # publishes the release. Cosign needs no token: it authenticates to
          # Fulcio with the job's OIDC identity.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITEE_TOKEN would be needed only once a Gitee mirror stanza exists.
          # It is intentionally absent from both this file and .goreleaser.yaml,
          # because an empty-token stanza fails the whole release.
          GORELAUNCHER_TOKEN: ${{ secrets.GORELAUNCHER_TOKEN }}

  build-otel:
    name: build with otel tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build with otel tag
        run: go build -tags otel ./...

      - name: Test with otel tag
        run: go test -tags otel -count=1 ./...
