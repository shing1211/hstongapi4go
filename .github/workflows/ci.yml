name: CI

# Public Go SDK module: github.com/shing1211/hstongapi4go (Apache-2.0).
#
# The Go toolchain version is NOT hard-coded here: actions/setup-go reads it
# from go.mod via `go-version-file`, so go.mod remains the single source of
# truth. go.mod carries both a `go 1.26` language floor for consumers and a
# `toolchain go1.26.6` directive for the toolchain this module is built and
# scanned with. Every setup-go step also sets `check-latest: true` so a runner
# never builds or scans with a stale patch release, because actions/setup-go
# exports GOTOOLCHAIN=local and would otherwise refuse to move forward.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The money guard and the scripts/ unit tests are Python, and both run
      # through make targets that resolve $(PYTHON) to python3. The runner image
      # ships a Python, but pinning the minor version here means a test result
      # cannot change underneath a commit because the image did — the same
      # reasoning that pins gosec and govulncheck. Same pin as the docs job.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: go build ./...

      - name: gofmt check
        # Generated protobuf code under gen/ is excluded (see .golangci.yml);
        # everything else must be gofmt-clean.
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Money type check (no float money fields)
        run: make money-check

      # A test nothing executes is not a test. stdlib unittest only — no pytest
      # (AGENTS.md rule 8 admits no new dependency without an ADR).
      - name: scripts/ unit tests (check_money)
        run: make scripts-test

  proto:
    name: proto-verify
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
      - name: Proto verify
        run: bash scripts/proto_verify.sh

  docs:
    name: docs-check
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-revision-date-localized plugin needs real history; with the
          # default shallow fetch it warns, and `mkdocs build --strict` turns
          # that warning into a failure.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install doc tools
        # mkdocs.yml lists the git-revision-date-localized plugin, so it must be
        # installed too or the strict build aborts on a config error.
        run: |
          pip install --quiet mkdocs 'mkdocs-material[imaging]' mkdocs-git-revision-date-localized-plugin
      - name: Check links
        run: python scripts/check_links.py
      - name: Check i18n lockstep
        run: python scripts/check_i18n.py
      - name: Build docs (strict)
        run: mkdocs build --strict

  license:
    name: license-check
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check SPDX headers
        run: |
          go install github.com/google/addlicense@latest
          addlicense -check client/ pkg/ internal/ cmd/ scripts/

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # golangci-lint-action v8 (v7+ supports golangci-lint v2). golangci-lint
      # >= v2.9 is required for the `go 1.26` directive, so pin that line.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9

  security:
    name: gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # gosec lives in github.com/securego/gosec. The previous path
      # (honnef.co/go/tools/cmd/gosec) is staticcheck's module and does not
      # exist, so this job failed at install and govulncheck never ran.
      # Both are pinned rather than @latest so a scanner result is reproducible
      # and cannot change without a commit.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
      - name: Run gosec
        run: gosec -exclude-generated ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        run: govulncheck ./...

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the working tree and the commit history, so the
          # history must be fetched rather than the default shallow clone.
          fetch-depth: 0
      # Pinned by exact tag, not @latest, for the same reason gosec and
      # govulncheck are pinned: an upstream release must not change a security
      # result without a commit. See docs/adr/0012-ci-secret-scanning.md.
      - name: Scan repository history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          # Scan the whole history of the pushed ref, not just its diff, so a
          # credential that landed in an earlier commit is still reported.
          args: detect --source . --redact --no-banner

  otel:
    name: build and test with otel tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # The OTel instrumentation is behind the `otel` build tag, so the default
      # build never compiles or exercises it. The release workflow already built
      # and tested it, but only on a version tag; this job runs on every push and
      # pull request so a break is caught before release rather than during it.
      - name: Build with otel tag
        run: go build -tags otel ./...
      - name: Vet with otel tag
        run: go vet -tags otel ./...
      - name: Test with otel tag
        run: go test -tags otel ./... -count=1

  fuzz:
    name: bounded fuzz seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # A normal `go test ./...` runs only the seed corpus. This runs the fuzz
      # target for a bounded wall-clock budget so it explores beyond the twelve
      # inline `f.Add` seeds without turning CI into a long fuzzing campaign.
      # The budget is deliberately small: a smoke test for new inputs, not a
      # substitute for a dedicated fuzzing run.
      - name: Fuzz ReadFrame
        run: go test ./internal/push/ -run=^$ -fuzz=FuzzReadFrame -fuzztime=30s

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run coverage gate
        run: make coverage

  goreleaser:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GoReleaser is installed from its published binary by the official action.
      # `go install github.com/goreleaser/goreleaser@latest` resolved a dependency
      # on golang.org/x/tools@v0.21.0, which does not compile under the Go 1.26
      # compiler ("invalid array length -delta * delta"), so this job failed
      # before the configuration was ever checked.
      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check --config .goreleaser.yaml

  sbom:
    name: sbom generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM
        run: python scripts/gen_sbom.py hstongapi4go_sbom.json
      - name: Validate SBOM JSON
        run: python -c "import json; json.load(open('hstongapi4go_sbom.json')); print('SBOM JSON valid')"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: hstongapi4go_sbom.json
          retention-days: 30
