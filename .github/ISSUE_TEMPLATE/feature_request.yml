name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature or an improvement? Share it here.
        Describe the problem it solves and the expected behaviour.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this feature is not already requested
          required: true
        - label: This is a genuine feature request, not a usage question
          required: true

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Clear and concise description of the feature
      placeholder: |
        As a [user type], I want [goal] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? Why is it important?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you evaluated
