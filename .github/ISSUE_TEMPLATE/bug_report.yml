name: Bug Report
description: Report something that is not working correctly
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as possible so
        the maintainers can reproduce and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this bug is not already reported
          required: true
        - label: I am using the latest version of the SDK
          required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: go1.26.8 linux/amd64
    validations:
      required: true

  - type: input
    id: gateway-version
    attributes:
      label: Gateway version
      description: Version of the HStong Gateway (e.g. 2.4.1)
      placeholder: "2.4.1"
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Git commit hash or tag (e.g. v0.1.1)
      placeholder: v0.1.1
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Standalone code (without credentials) that reproduces the issue.
        Redact any secrets (passwords, tokens, keys).
      placeholder: |
        package hstong_test

        import (
            "context"
            "testing"

            "github.com/shing1211/hstongapi4go/client"
        )

        func TestBugRepro(t *testing.T) {
            c, err := client.New()
            // ...
        }
    validations:
      required: true

  - type: dropdown
    id: market
    attributes:
      label: Market / exchange
      description: Which market are you testing against?
      options:
        - label: Hong Kong (HK)
          value: HK
        - label: United States (US)
          value: US
        - label: Shenzhen (A-shares)
          value: Shenzhen
        - label: Shanghai (A-shares)
          value: Shanghai
        - label: Other / Unknown
          value: Other
    validations:
      required: true

  - type: dropdown
    id: integration-status
    attributes:
      label: HSTONG_INTEGRATION status
      description: Were you running against the mock Gateway or a live HStong Gateway?
      options:
        - label: Mock Gateway (no live account needed)
          value: mock
        - label: Live HStong Gateway (HSTONG_INTEGRATION=1)
          value: live
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen? What actually happened?
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error output
      description: Full error message and stack trace (secrets redacted)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (environment, OS, network, etc.)
