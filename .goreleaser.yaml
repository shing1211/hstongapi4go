# .goreleaser.yaml — release artefacts for hstongapi4go.
#
# hstongapi4go is a library. Its only main package is the standalone mock
# Gateway, so that is what this file builds; the library itself is consumed
# through `go get` and needs no binary.
#
# Validate the configuration (no artefacts, no uploads):
#   goreleaser check --config .goreleaser.yaml
#
# Build a snapshot locally:
#   goreleaser build --config .goreleaser.yaml --snapshot --clean
#
# Publish a real release:
#   GITHUB_TOKEN=... goreleaser release --config .goreleaser.yaml
#
# CI runs `goreleaser check` on every push (.github/workflows/ci.yml) and again
# on a version tag (.github/workflows/release.yml). Publishing is a manual
# `goreleaser release`; see docs/RELEASE_CHECKLIST.md.
#
# Signing and attestation are intentionally not configured here. Cosign and SLSA
# provenance both need key or OIDC credentials that this repository does not
# manage, and an unverifiable signing stanza would fail the release rather than
# protect it. Add them once the credentials exist.

version: 2

project_name: hstongapi4go

builds:
  - id: mock-gateway
    main: ./cmd/hstong-mock-gateway
    binary: hstong-mock-gateway
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mock-gateway
    ids:
      - mock-gateway
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: sbom
    artifacts: archive

release:
  github:
    owner: shing1211
    name: hstongapi4go
  draft: false
  prerelease: auto
