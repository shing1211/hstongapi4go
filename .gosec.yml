# gosec configuration.
#
# Path exclusion is not configured here: gosec's `excludes` field takes rule
# IDs, not paths. Generated code is excluded with the -exclude-generated flag,
# which matches the standard "Code generated by ... DO NOT EDIT." header rather
# than a directory list, so adding a generated package needs no edit here.
# The flag is set in the Makefile (make gosec) and in .github/workflows/ci.yml.
#
# Every rule is enabled. Nothing is switched off globally, so a new finding
# anywhere in hand-written code is reported.
#
# A suppression that is specific to one call site is written inline as
# `#nosec <rule> -- <reason>`, so the justification is reviewable where the code
# is rather than hidden in this file. Current suppressions:
#
#   G101  internal/crypto/aes.go  the HStong trade-password key is published
#                                 protocol reference data, not a secret (ADR 0005)
#   G101  client/env.go           an HSTONG_* environment variable name
#   G115  internal/push/frame.go  fixed-width wire encode/decode; ReadFrame
#                                 range-checks BodyLen before it is used
#   G115  internal/push/manager.go, pkg/hstong/stream, pkg/hstong/future,
#         test/mockgateway        bounded or round-tripped conversions
#   G204  scripts/coverage_gate.go  a fixed argv from a hardcoded list
#   G401  internal/push/verify.go    SHA1WithRSA push verification, fixed by
#                                   the Gateway wire protocol (ADR 0005)
#   G404  retry and reconnect jitter, not a security-sensitive value
#   G505  internal/push/verify.go    crypto/sha1 import, as above
#   G706  examples/algo             example code logging a Gateway order id
